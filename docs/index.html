<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC Taxi Traffic — 언제, 어디서 막히는가</title>
<meta name="description" content="NYC 택시 14,446건으로 본 요일·시간·지역별 트래픽 대시보드">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section class="dash">
  <main class="map-col">
    <header class="hero">
      <h1>NYC Taxi Traffic</h1>
      <p class="sub">2016년 상반기 택시 이용 정보 기반 교통량 시각화</p>
    </header>
    <div class="layer-switch" role="tablist">
      <button data-layer="flow" class="on">도로 플로우</button><button data-layer="hex">헥스빈 히트맵</button>
    </div>
    <div id="map"></div>
    <div id="kpis" class="kpis">
      <div class="kpi"><span class="kpi-label">분석 트립</span><span class="kpi-value" id="kpi-total">—</span></div>
      <div class="kpi"><span class="kpi-label">평균 속력<i>최단 경로</i></span><span class="kpi-value" id="kpi-speed">—</span></div>
      <div class="kpi"><span class="kpi-label">평균 이동거리<i>최단 경로</i></span><span class="kpi-value" id="kpi-dist">—</span></div>
      <div class="kpi"><span class="kpi-label">최저속 시간대</span><span class="kpi-value" id="kpi-slowest">—</span></div>
    </div>
  </main>

  <aside class="panel">
    <section class="controls">
      <div class="ctl-group ctl-flow">
        <span class="ctl-label">요일 범위</span>
        <button data-wp="wd">주중</button><button data-wp="we">주말</button><button data-wp="all" class="on">전체</button>
        <span class="ctl-note"></span>
      </div>
      <div class="ctl-group ctl-flow ctl-band">
        <span class="ctl-label">시간대</span>
        <button data-band="0"><span>새벽</span><small>0–6</small></button><button data-band="1"><span>오전</span><small>6–12</small></button><button data-band="2"><span>오후</span><small>12–18</small></button><button data-band="3"><span>저녁</span><small>18–24</small></button><button data-band="all" class="on"><span>전체</span></button>
      </div>
      <div class="ctl-group ctl-days" hidden>
        <span class="ctl-label">요일</span>
        <button data-day="0" class="on">월</button><button data-day="1" class="on">화</button><button data-day="2" class="on">수</button><button data-day="3" class="on">목</button><button data-day="4" class="on">금</button><button data-day="5" class="on">토</button><button data-day="6" class="on">일</button>
        <button id="days-all" class="ctl-toggle on">전체 요일</button>
      </div>
      <div class="ctl-group ctl-hour" hidden>
        <span class="ctl-label">시간</span>
        <button id="hour-all" class="ctl-toggle on">전체 시간</button>
        <input type="range" id="hour" min="0" max="23" value="18" disabled>
        <span id="hour-label"></span>
      </div>
      <div class="ctl-group ctl-metric" hidden>
        <span class="ctl-label">표시</span>
        <button data-metric="speed" class="on">평균 속력</button><button data-metric="count">이용 밀도</button>
      </div>
    </section>

    <div class="chart-box chart-box--hour">
      <h2>시간대별 트립 수 <span class="chart-sub">(선택 요일 기준)</span></h2>
      <div id="chart-hour"></div>
    </div>

    <div class="chart-box chart-box--heat">
      <h2>요일 × 시간 평균 속력</h2>
      <div id="chart-heat"></div>
    </div>
  </aside>
</section>

<footer class="foot">
  <p>© 2026 Shinsung Kang · Claude Code 기반 제작. 모든 경로는 OSMnx 도로망 최단 경로를 기준으로 계산됨. <a href="https://github.com/HollyRiver/NYCTaxiDash">GitHub</a></p>
</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script src="js/main.js"></script>
</body>
</html>
