<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC Taxi Traffic — 언제, 어디서 막히는가</title>
<meta name="description" content="NYC 택시 14,446건으로 본 요일·시간·지역별 트래픽 대시보드">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
  <h1>NYC Taxi Traffic</h1>
  <p class="sub">2016년 상반기 표본 <span id="kpi-n">—</span>건으로 본 "언제, 어디서 막히는가"</p>
</header>

<section id="kpis" class="kpis">
  <div class="kpi"><span class="kpi-value" id="kpi-total">—</span><span class="kpi-label">분석 트립</span></div>
  <div class="kpi"><span class="kpi-value" id="kpi-speed">—</span><span class="kpi-label">평균 속력 (직선거리 기준)</span></div>
  <div class="kpi"><span class="kpi-value" id="kpi-slowest">—</span><span class="kpi-label">최저속 시간대</span></div>
  <div class="kpi"><span class="kpi-value" id="kpi-dist">—</span><span class="kpi-label">평균 이동거리</span></div>
</section>

<section class="controls">
  <div class="ctl-group ctl-days">
    <span class="ctl-label">요일</span>
    <button data-day="0" class="on">월</button><button data-day="1" class="on">화</button><button data-day="2" class="on">수</button><button data-day="3" class="on">목</button><button data-day="4" class="on">금</button><button data-day="5" class="on">토</button><button data-day="6" class="on">일</button>
    <button id="days-all" class="ctl-aux">전체 선택</button><button id="days-none" class="ctl-aux">해제</button>
  </div>
  <div class="ctl-group ctl-hour">
    <span class="ctl-label">시간</span>
    <input type="range" id="hour" min="-1" max="23" value="-1">
    <span id="hour-label">전체 시간</span>
  </div>
  <div class="ctl-group ctl-metric">
    <span class="ctl-label">지표</span>
    <button data-metric="count" class="on">트립 밀도</button><button data-metric="speed">평균 속력</button>
  </div>
  <div class="ctl-group ctl-layer">
    <span class="ctl-label">레이어</span>
    <button data-layer="hex" class="on">헥스빈</button><button data-layer="flow">도로 플로우</button>
  </div>
  <div class="ctl-group ctl-flow" hidden>
    <span class="ctl-label">플로우</span>
    <button data-wp="wd" class="on">주중</button><button data-wp="we">주말</button>
    <span class="ctl-sep"></span>
    <button data-band="0">새벽 0–6</button><button data-band="1" class="on">오전 6–12</button><button data-band="2">오후 12–18</button><button data-band="3">저녁 18–24</button>
    <span class="ctl-note">플로우는 주중/주말 × 시간대 단위 집계</span>
  </div>
</section>

<main><div id="map"></div></main>

<section class="charts">
  <div class="chart-box"><h2>요일 × 시간 평균 속력</h2><div id="chart-heat"></div></div>
  <div class="chart-box"><h2>시간대별 트립 수 <span class="chart-sub">(선택 요일 기준)</span></h2><div id="chart-hour"></div></div>
</section>

<section class="notes" id="insights">
  <h2>관찰</h2>
  <ul><!-- Task 9에서 실측 기반으로 채움 --></ul>
</section>

<footer class="foot">
  <!-- Task 9에서 출처·정제 기준·한계·제작 노트 채움 -->
</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script src="js/main.js"></script>
</body>
</html>
